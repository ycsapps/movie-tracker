g/" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB. Your movie collection is stored locally in this browser. Export backups regularly.</footer></div><div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-inner"><button class="btn alt tiny close" id="closeModal">✕ Close</button><div id="modalContent"></div></div></div><script> 'use strict';

], '37':[['','All western'],['spaghetti western','Spaghetti western']]};

let db=load(),tab='home',searchText='',searchResults=[],searchError='',searchSort='relevance',myFilter='All',mySort='added',archiveResults=[],archivePage=0,archivePages=1,archiveBusy=false,archiveError='',archiveSignature='',requestSerial=0;

function load(){try{let v=JSON.parse(localStorage.getItem(K)||'{}');return {key:v.key||'',movies:v.movies&&typeof v.movies==='object'?v.movies:{},lists:Array.isArray(v.lists)?v.lists:[]}}catch{return {key:'',movies:{},lists:[]}}}

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),poster=p=>p?IMG+p:'',movies=()=>Object.values(db.movies),pic=(p,n='Movie poster')=>p?`<img class="poster" src="${poster(p)}" alt="${esc(n)}" loading="lazy">`:'<div class="poster placeholder">No poster</div>',fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'Unknown';
async function api(path){if(!db.key)throw Error('Add your TMDB API Read Access Token in Settings first.');let r=await fetch(API+path+(path.includes('?')?'&':'?')+'language=en-US',{headers:{Authorization:'Bearer '+db.key}});if(!r.ok)throw Error(r.status===401?'TMDB token not accepted. Check Settings.':`TMDB request failed (${r.status}).`);return r.json()}
function modal(h){$('#modalContent').innerHTML=h;$('#modal').classList.remove('hidden')}function close(){$('#modal').classList.add('hidden');$('#modalContent').innerHTML=''}$('#closeModal').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('#settingsBtn').onclick=settings;

function quickAdd(x){if(db.movies[x.id])return;db.movies[x.id]={id:x.id,title:x.title||x.name||'',poster:x.poster_path||x.poster||'',release_date:x.release_date||'',runtime:x.runtime||0,status:'Unassigned',rating:0,rewatch:false,timesWatched:0,dateWatched:'',approxYear:'',platform:'',notes:'',added:Date.now()};save();render()}
function card(x,archiveActions=false){let saved=!!db.movies[x.id],status=db.movies[x.id]?.status||'';return `<article class="tile"><div class="poster-wrap"><button class="poster-open" data-detail="${x.id}" aria-label="Open ${esc(x.title)}">${pic(x.poster_path||x.poster,x.title)}</button>${archiveActions?'':`<button class="poster-quick ${saved?'is-saved':''}" data-quick="${x.id}" ${saved?'disabled':''} aria-label="${saved?'Already saved':'Quick add '+esc(x.title)}">${saved?'✓':'+'}</button>`}</div><h3>${esc(x.title)}</h3><p>${esc((x.release_date||'').slice(0,4))}${saved?' · '+esc(status):''}</p>${archiveActions?`<div class="archive-actions"><button type="button" data-movie-action="add" data-movie-id="${x.id}" class="${saved?'active':''}" aria-label="Add ${esc(x.title)} to My Movies" title="Add to My Movies" aria-pressed="${saved}">+</button><button type="button" data-movie-action="watched" data-movie-id="${x.id}" class="${status==='Watched'?'active':''}" aria-label="Mark ${esc(x.title)} watched" title="Watched" aria-pressed="${status==='Watched'}">✓</button><button type="button" data-movie-action="want" data-movie-id="${x.id}" class="${status==='Want to Watch'?'active':''}" aria-label="Mark ${esc(x.title)} want to watch" title="Want to Watch" aria-pressed="${status==='Want to Watch'}">♥</button></div>`:''}</article>`}
function sorted(a,mode){return a.slice().sort((x,y)=>{let t=(x.title||'').localeCompare(y.title||'',undefined,{sensitivity:'base'});if(mode==='az')return t;if(mode==='za')return -t;if(mode==='old')return (x.release_date||'9999').localeCompare(y.release_date||'9999')||t;if(mode==='new')return (y.release_date||'').localeCompare(x.release_date||'')||t;if(mode==='rating')return (Number(y.rating)||0)-(Number(x.rating)||0)||t;return (y.added||0)-(x.added||0)||t})}
function select(name,items,value){return `<label>${name}<select class="field" data-filter="${name}">${items.map(([v,t])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function years(){let now=new Date().getFullYear(),start=f.decade==='all'?1880:Number(f.decade),end=f.decade==='all'?now:Math.min(now,start+9);if(f.period==='first')end=Math.min(end,start+4);if(f.period==='second')start+=5;return Array.from({length:Math.max(0,end-start+1)},(_,i)=>[String(start+i),String(start+i)])}
function archiveUI(){let decades=[['all','All decades'],...Array.from({length:15},(_,i)=>[String(1880+i*10),String(1880+i*10)+'s'])];let subs=SUBS[f.genre]||[['','All subgenres']];return `<div class="panel hero"><div class="eyebrow">YOUR LIFETIME MOVIE ARCHIVE</div><h2>Rediscover the films you remember.</h2><p>Browse by release year, genre and more. Add old favourites without needing to remember when you watched them.</p></div><div class="panel"><div class="filters">${select('decade',decades,f.decade)}${select('period',[['all','Entire decade'],['first','First five years'],['second','Second five years']],f.period)}${select('year',[['all','All years in period'],...years()],f.year)}${select('genre',GENRES,f.genre)}${select('sub',subs,f.sub)}${select('country',COUNTRIES,f.country)}${select('language',LANGUAGES,f.language)}${select('runtime',RUNTIMES,f.runtime)}${select('sort',SORTS,f.sort)}</div><label class="row"><input type="checkbox" id="customDates" ${f.custom?'checked':''}> Use custom release-year range</label>${f.custom?`<div class="row"><label>From year<input class="field" id="fromYear" type="number" min="1880" max="2100" placeholder="e.g. 2003" value="${esc(f.from)}"></label><label>To year<input class="field" id="toYear" type="number" min="1880" max="2100" placeholder="e.g. 2008" value="${esc(f.to)}"></label></div>`:''}<button class="btn" id="browse" ${archiveBusy?'disabled':''}>${archiveBusy?'Loading…':'Browse films'}</button><p><small>Subgenres are approximate keyword searches, not official TMDB genres. Release-year filters use premiere/release dates. Country refers to production country; original language is a separate filter.</small></p></div>${archiveError?`<p class="error">${esc(archiveError)}</p>`:''}<div class="toolbar section"><h2>Browse results</h2><small>${archivePage?`Page ${archivePage} of ${archivePages}`:''}</small></div>${archiveResults.length?`<div class="grid">${archiveResults.map(x=>card(x,true)).join('')}</div><p><button class="btn alt" id="m function render(){let m=$('#main'),a=movies();if(tab==='home'){let feature=a.find(x=>x.status==='Watching')||sorted(a,'added')[0];m.innerHTML=`<div class="netflixhero" ${feature?.poster?`style="background-image:linear-gradient(90deg,#101014 3%,rgba(16,16,20,.83) 46%,rgba(16,16,20,.25)),url('${poster(feature.poster)}')"`:''}><div class="eyebrow">YOUR MOVIE UNIVERSE</div><h2>${feature?esc(feature.title):'Your movie collection starts here'}</h2><p>Rediscover favourites, save films to watch and build your lifetime archive.</p><button class="btn" data-go="discover">Find a film</button></div><div class="stats"><div class="stat"><strong>${a.length}</strong><span>Films saved</span></div><div class="stat"><strong>${a.filter(x=>x.status==='Watched').length}</strong><span>Watched</span></div><div class="stat"><strong>${a.filter(x=>x.status==='Want to Watch').length}</strong><span>Want to watch</span></div></div>${row('Recently added',sorted(a,'added').slice(0,12))}${row('Want to Watch',a.filter(x=>x.status==='Want to Watch'))}${row('Rewatch',a.filter(x=>x.rewatch))}`;return}

if(tab==='archive'){m.innerHTML=archiveUI();m.querySelectorAll('[data-filter]').forEach(el=>el.onchange=()=>{f[el.dataset.filter]=el.value;if(el.dataset.filter==='genre')f.sub='';if(['decade','period'].includes(el.dataset.filter))f.year='all';archiveResults=[];archivePage=0;archiveSignature='';render()});$('#customDates').onchange=e=>{f.custom=e.target.checked;archiveResults=[];archivePage=0;render()};if(f.custom){$('#fromYear').oninput=e=>f.from=e.target.value;$('#toYear').oninput=e=>f.to=e.target.value}$('#browse').onclick=()=>fetchArchive(false);if($('#more'))$('#more').onclick=()=>fetchArchive(true);return}
if(tab==='movies'||tab==='rewatch'){let items=a.filter(x=>(tab==='rewatch'?x.rewatch:(myFilter==='All'||x.status===myFilter)));m.innerHTML=`<h2>${tab==='rewatch'?'↻ Rewatch':'My Movies'} <small>(${items.length})</small></h2>${tab==='movies'?`<div class="chips">${['All','Unassigned','Watched','Want to Watch','Watching','Dropped'].map(z=>`<button data-status="${z}" class="${myFilter===z?'active':''}">${z}</button>`).join('')}</div>`:''}${select('mySort',[['added','Recently added'],['az','Title A–Z'],['za','Title Z–A'],['new','Release: newest'],['old','Release: oldest'],['rating','My rating']],mySort)}${items.length?`<div class="grid">${sorted(items,mySort).map(card).join('')}</div>`:'<div class="empty">No films here yet.</div>'}`;m.querySelector('[data-filter="mySort"]').onchange=e=>{mySort=e.target.value;render()};return}
if(tab==='lists'){m.innerHTML=`<h2>Custom collections</h2><form id="listForm" class="row"><input id="listName" class="field" style="flex:1;min-width:170px;margin:0" placeholder="e.g. Comfort films" maxlength="60" required><button class="btn">Create list</button></form>${db.lists.map(l=>`<div class="panel"><div class="toolbar"><h3>${esc(l.name)} <small>(${l.ids.length})</small></h3><button class="btn alt tiny" data-delete="${l.id}">Delete</button></div><div class="grid">${l.ids.map(id=>db.movies[id]?card(db.movies[id]):'').join('')}</div></div>`).join('')}`;$('#listForm').onsubmit=e=>{e.preventDefault();let name=$('#listName').value.trim();if(name){db.lists.push({id:String(Date.now()),name,ids:[]});save();render()}};return}
let watched=a.filter(x=>x.status==='Watched'),minutes=watched.reduce((n,x)=>n+(Number(x.runtime)||0),0);m.innerHTML=`<h2>Your movie statistics</h2><div class="stats"><div class="stat"><strong>${a.length}</strong><span>Saved films</span></div><div class="stat"><strong>${watched.length}</strong><span>Watched</span></div><div class="stat"><strong>${(minutes/60).toFixed(1)}</strong><span>Known film hours</span></div><div class="stat"><strong>${a.filter(x=>x.rewatch).length}</strong><span>Rewatch list</span></div></div><p class="notice">Viewing hours count the runtime of watched films where known, once per film. Rewatches aren't included.</p><div class="panel"><h3>By status</h3>${['Unassigned','Watched','Want to Watch','Watching','Dropped'].map(z=>`<div class="row between"><span>${z}</span><strong>${a.filter(x=>x.status===z).length}</strong></div>`).join('')}</div><div class="panel"><h3>By release decade</h3>${Array.from({length:15},(_,i)=>1880+i*10).map(y=>`<div class="row between"><span>${y}s</span><strong>${a.filter(x=>Number((x.release_date||'').slice(0,4))>=y&&Number((x.release_date||'').slice(0,4))<y+10).length}</strong></div>`).join('')}</div>`}
function row(title,items){return `<section class="section"><h2>${title}</h2>${items.length?`<div class="posterrow">${items.map(card).join('')}</div>`:'<div class="empty">Nothing here yet.</div>'}</section>`}
$('#main').onclick=e=>{let action=e.target.closest('[data-movie-action]');if(action){e.preventDefault();let id=Number(action.dataset.movieId),x=[...archiveResults,...searchResults,...movies()].find(z=>Number(z.id)===id);if(!x)return;if(!db.movies[id])quickAdd(x);let movie=db.movies[id];if(action.dataset.movieAction==='watched'){movie.status='Watched';if(!movie.timesWatched)movie.timesWatched=1}else if(action.dataset.movieAction==='want'){movie.status='Want to Watch'}save();render();return}let q=e.target.closest('[data-quick]');if(q){let id=Number(q.dataset.quick);let x=[...searchResults,...archiveResults,...movies()].find(x=>x.id===id);if(x)quickAdd(x);return}let d=e.target.closest('[data-detail]'),g=e.target.closest('[data-go]'),s=e.target.closest('[data-status]'),del=e.target.closest('[data-delete]');if(d)openMovie(Number(d.dataset.detail));if(g)setTab(g.dataset.go);if(s){myFilter=s.dataset.status;render()}if(del&&confirm('Delete this collection?')){db.lists=db.lists.filter(l=>l.id!==del.dataset.delete);save();render()}};
function dateRange(){let start='',end='';if(f.custom){start=f.from;end=f.to;if(start&&!/^\d{4}$/.test(start)||end&&!/^\d{4}$/.test(end)||start&&end&&Number(start)>Number(end))throw Error('Enter a valid From–To year range.')}else if(f.year!=='all'){start=end=f.year}else if(f.decade!=='all'){start=String(Number(f.decade)+(f.period==='second'?5:0));end=String(Number(f.decade)+(f.period==='first'?4:9))}return [start,end]}
async function fetchArchive(more){if(archiveBusy)return;let signature=JSON.stringify(f);if(more&&signature!==archiveSignature){more=false}let page=more?archivePage+1:1;if(page>archivePages&&more)return;archiveBusy=true;archiveError='';let serial=++requestSerial;render();try{let q=new URLSearchParams({sort_by:f.sort,page:String(page),include_adult:'false'});let [start,end]=dateRange();if(start)q.set('primary_release_date.gte',start+'-01-01');if(end)q.set('primary_release_date.lte',end+'-12-31');if(f.genre)q.set('with_genres',f.genre);if(f.country!=='all')q.set('with_origin_country',f.country);if(f.language!=='all')q.set('with_original_language',f.language);if(f.runtime==='short')q.set('with_runtime.lte','89');if(f.runtime==='medium'){q.set('with_runtime.gte','90');q.set('with_runtime.lte','120')}if(f.runtime==='long')q.set('with_runtime.gte','121');if(f.sort==='vote_average.desc')q.set('vote_count.gte','50');if(f.sub){let keywords=await api('/search/keyword?query='+encodeURIComponent(f.sub));let ids=(keywords.results||[]).filter(k=>k.name.toLowerCase()===f.sub.toLowerCase()).map(k=>k.id);if(!ids.length)ids=(keywords.results||[]).slice(0,3).map(k=>k.id);if(ids.length)q.set('with_keywords',ids.join('|'));else throw Error('No TMDB keyword found for this subgenre. Try the main genre.')}let data=await api('/discover/movie?'+q);if(serial!==requestSerial)return;let seen=new Set(more?archiveResults.map(x=>x.id):[]);let fresh=(data.results||[]).filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true});archiveResults=more?[...archiveResults,...fresh]:fresh;archivePage=data.page||page;archivePages=Math.min(data.total_pages||1,500);archiveSignature=signature}catch(err){archiveError=err.message}finally{archiveBusy=false;render()}}
async function openMovie(id){modal('<h2>Loading film…</h2>');try{let d=await api('/movie/'+id+'?append_to_response=watch/providers');showMovie(d)}catch(e){modal(`<h2>Could not load film</h2><p class="error">${esc(e.message)}</p>`)}}
function showMovie(d){let x=db.movies[d.id],providers=d['watch/providers']?.results?.GB?.flatrate||[];modal(`<div class="detail">${pic(d.poster_path,d.title)}<div><div class="eyebrow">${esc((d.release_date||'').slice(0,4))} · ${d.runtime||'Unknown'} min</div><h2>${esc(d.title)}</h2><p>${esc((d.genres||[]).map(z=>z.name).join(' · '))}</p><p><small>UK streaming (TMDB): ${esc(providers.map(z=>z.provider_name).join(', ')||'Not listed')}</small></p>${!x?'<button class="btn" id="addMovie">+ Quick add to My Movies</button>':'<span class="eyebrow">✓ In your collection</span>'}</div></div>${x?`<section class="section"><label>Watch status<select id="status" class="field">${['Unassigned','Watched','Want to Watch','Watching','Dropped'].map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select></label><label>My rating / 10<select id="rating" class="field"><option value="0">Not rated</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${Number(x.rating)===i+1?'selected':''}>${i+1}/10</option>`).join('')}</select></label><label class="rewatchcheck"><input id="rewatch" type="checkbox" ${x.rewatch?'checked':''}> Add to Rewatch</label><label>Date watched (optional)<input class="field" type="date" id="dateWatched" value="${esc(x.dateWatched||'')}"></label><label>Approximate year watched (optional)<input class="field" id="approxYear" type="number" min="1880" max="2100" placeholder="e.g. 2006" value="${esc(x.approxYear||'')}"></label><label>Times watched (optional)<input class="field" id="timesWatched" type="number" min="0" max="999" value="${Number(x.timesWatched)||0}"></label><label>Where I watched it<input class="field" id="platform" placeholder="e.g. Cinema, Netflix, DVD" value="${esc(x.platform||'')}"></label><label>Notes<textarea class="field" id="notes" placeholder="Memories, favourite scenes, thoughts…">${esc(x.notes||'')}</textarea></label><button class="btn" id="saveMovie">Save changes</button><h3 class="section">Custom collections</h3><div class="checklist">${db.lists.map(l=>`<label><input type="checkbox" data-list="${l.id}" ${l.ids.includes(x.id)?'checked':''}> ${esc(l.name)}</label>`).join('')||'<p>Create a collection in Lists.</p>'}</div><p><button class="btn outline" id="removeMovie">Remove film from tracker</button></p></section>`:''}<details class="panel section"><summary style="cursor:pointer;font-weight:700">About this film · Read description</summary><p>${esc(d.overview||'No synopsis available.')}</p></details>`);if(!x){$('#addMovie').onclick=()=>{quickAdd(d);showMovie(d)};return}$('#saveMovie').onclick=()=>{x.status=$('#status').value;x.rating=Number($('#rating').value);x.rewatch=$('#rewatch').checked;x.dateWatched=$('#dateWatched').value;x.approxYear=$('#approxYear').value;x.timesWatched=Math.max(0,Number($('#timesWatched').value)||0);x.platform=$('#platform').value.trim();x.notes=$('#notes').value;x.runtime=d.runtime||x.runtime;x.release_date=d.release_date||x.release_date;save();showMovie(d);render()};$('#modalContent').onchange=e=>{let l=e.target.dataset.list;if(!l)return;let list=db.lists.find(z=>z.id===l);if(list){list.ids=e.target.checked?[...new Set([...list.ids,x.id])]:list.ids.filter(id=>id!==x.id);save()}};$('#removeMovie').onclick=()=>{if(confirm('Remove this film and its saved details?')){delete db.movies[x.id];db.lists.forEach(l=>l.ids=l.ids.filter(id=>id!==x.id));save();close();render()}}}
function settings(){modal(`<h2>Settings</h2><p>Enter your TMDB API Read Access Token from <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener" style="color:#cba8ff">TMDB API settings</a>. You can use the same token as your TV Tracker.</p><label>TMDB API Read Access Token<input id="token" class="field" type="password" autocomplete="off" value="${esc(db.key)}"></label><button class="btn" id="saveToken">Save token</button><p class="notice">Your token is stored in this browser, not embedded in the public HTML. Never put it in GitHub code or share an exported configured browser profile.</p><h3>Back up your collection</h3><p>Export regularly, especially before updates or changing browsers. Movie and TV backups are separate.</p><div class="row"><button class="btn alt" id="export">Export JSON backup</button><label class="btn alt" for="import">Import backup</label><input id="import" class="hidden" type="file" accept=".json,application/json"></div><p><button class="btn outline" id="clearToken">Remove saved token</button></p>`);$('#saveToken').onclick=()=>{db.key=$('#token').value.trim();save();close();render()};$('#clearToken').onclick=()=>{db.key='';save();close();render()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,movies:db.movies,lists:db.lists},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-movie-tracker-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d||!d.movies||typeof d.movies!=='object'||Array.isArray(d.movies)||!Array.isArray(d.lists))throw Error('Not a valid Movie Tracker backup. TV Tracker backups cannot be imported here.');if(!confirm('Replace your current movie collection with this backup? Export your current collection first.'))return;db={key:db.key,movies:d.movies,lists:d.lists};save();close();render()}catch(err){alert(err.message)}}}
render();
</script></body></html>
